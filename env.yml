name: scrn_ai
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core language
  - python=3.11

  # Python data stack
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - h5py

  # Single-cell analysis
  - scanpy
  - anndata
  - scvelo
  - harmonypy
  - loompy

  # Visualisation
  - matplotlib
  - seaborn

  # R integration for Seurat, BLTSA, edgeR
  - r-base>=4.3
  - rpy2
  - r-seurat
  - bioconductor-edger
  - bioconductor-scran
  - r-sctransform

  # Command-line niceties
  - click
  - tqdm

  # AI/LLM integration
  - openai>=1.0.0

  - pip
  - pip:
      - pyVIA  # STAVIA/VIA 2.0