# ═══════════════════════════════════════════════════════════════════════
# scRN_AI v1.0.0 — Conda environment (full install including R)
#
# Create:   conda env create -f env.yml
# Activate: conda activate scrn_ai
# Install:  pip install -e .
#
# For a pure-Python install (no R), use requirements.txt instead.
# ═══════════════════════════════════════════════════════════════════════
name: scrn_ai
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core language
  - python>=3.9,<3.13

  # Python data stack
  - numpy>=1.20
  - scipy>=1.7
  - pandas>=1.3
  - scikit-learn>=1.0
  - h5py>=3.0

  # Single-cell analysis
  - scanpy>=1.9
  - anndata>=0.8
  - leidenalg>=0.8
  - loompy>=3.0

  # Visualization
  - matplotlib>=3.4
  - seaborn>=0.11

  # R integration (Seurat, edgeR, scran, sctransform)
  - r-base>=4.3
  - rpy2>=3.5
  - r-seurat
  - bioconductor-edger
  - bioconductor-scran
  - r-sctransform

  # CLI
  - click>=8.0
  - tqdm

  # AI/LLM integration
  - openai>=1.0.0

  # Development
  - pytest>=7.0
  - ruff>=0.4
  - ipykernel>=6.0

  - pip
  - pip:
      - pyVIA  # STAVIA/VIA 2.0