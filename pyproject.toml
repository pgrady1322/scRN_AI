[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrn_ai"
version = "1.0.0"
description = "Single-cell RNA-seq analysis toolkit with AI-powered cell typing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Patrick Grady"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0",
    "scanpy>=1.9",
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "anndata>=0.8",
    "scikit-learn>=1.0",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "leidenalg>=0.8",
    "pyyaml>=6.0",
    "certifi",
]

[project.optional-dependencies]
r = ["rpy2>=3.5"]
via = ["pyVIA>=0.1"]
ai = ["cytetype>=0.17.0"]
export = ["loompy>=3.0"]
all = ["rpy2>=3.5", "pyVIA>=0.1", "cytetype>=0.17.0", "loompy>=3.0"]
dev = ["pytest>=7.0", "ruff>=0.4", "ipywidgets>=8.0", "ipykernel>=6.0"]

[project.scripts]
scrn_ai = "scrn_ai.cli:main"

[tool.setuptools.packages.find]
include = ["scrn_ai*"]

# ── Pytest ───────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# ── Ruff (linting + formatting) ─────────────────────────────────────────
[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (Click uses this)
]

[tool.ruff.lint.isort]
known-first-party = ["scrn_ai"]
